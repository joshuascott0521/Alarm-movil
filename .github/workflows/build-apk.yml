name: Compilar APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Compilar APK
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk alarma-de-parada.apk

      - uses: actions/upload-artifact@v4
        with:
          name: alarma-de-parada-apk
          path: alarma-de-parada.apk

      - name: Publicar versión descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Alarma de parada (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: alarma-de-parada.apk
          body: |
            Abre este enlace desde tu celular Android, descarga
            `alarma-de-parada.apk` y ábrelo para instalar
            (permite "instalar apps de origen desconocido" si te lo pide).
